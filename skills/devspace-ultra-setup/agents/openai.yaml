interface:
  display_name: DevSpace Ultra for ChatGPT Classic
  short_description: Install and verify ChatGPT Classic local development through DevSpace Ultra.
  default_prompt: >-
    Install or repair DevSpace Ultra for ChatGPT Classic, not Codex. Preserve existing state,
    prepare or verify the public OAuth-protected MCP endpoint, then create the exact ChatGPT
    Classic connection, complete OAuth, scan the full development tool catalogue, and prove
    fresh-chat read, authorized disposable write/edit/command, and reconnect behavior. Never
    stop at local health or omit a gate. Describe long-task continuity accurately, not as a
    literal change to OpenAI token, context, usage, or rate limits.
policy:
  allow_implicit_invocation: true
  network_secrets_in_chat: false
routing:
  keywords:
    - DevSpace Ultra setup
    - Local Gateway install
    - DuckDNS
    - DDNS
    - Caddy
    - Cloudflare tunnel
    - MCP public URL
    - backend recovery
