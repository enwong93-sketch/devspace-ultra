<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevSpace Progress Claim Relay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1px;
      height: 1px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: transparent;
      color: transparent;
      pointer-events: none;
    }
  </style>
</head>
<body aria-hidden="true">
<script>
(() => {
  let dispatchStarted = false;
  let relayRetired = false;

  const progressClaimFrom = (value) => {
    if (!value || typeof value !== "object") return null;
    return value?.structuredContent?.progressClaim ??
      value?.structured_content?.progressClaim ??
      value?.toolResult?.structuredContent?.progressClaim ??
      value?.["devspace/progressClaim"] ??
      value?._meta?.["devspace/progressClaim"] ??
      value?.progressClaim ??
      null;
  };

  const conversationStartClaimFrom = (value) => {
    if (!value || typeof value !== "object") return null;
    return value?.structuredContent?.conversationStartClaim ??
      value?.structured_content?.conversationStartClaim ??
      value?.toolResult?.structuredContent?.conversationStartClaim ??
      value?.["devspace/conversationStartClaim"] ??
      value?._meta?.["devspace/conversationStartClaim"] ??
      value?.conversationStartClaim ??
      null;
  };

  const relayActionFrom = (value) => {
    const progressClaim = progressClaimFrom(value);
    if (progressClaim?.claimId) {
      return {
        toolName: "devspace_progress_report",
        expiresAt: progressClaim.expiresAt,
        arguments: { claimId: progressClaim.claimId },
      };
    }
    const startClaim = conversationStartClaimFrom(value);
    if (!startClaim?.claimId) return null;
    if (startClaim.toolName === "devspace_goal_start") {
      return {
        toolName: startClaim.toolName,
        expiresAt: startClaim.expiresAt,
        arguments: {
          claimId: startClaim.claimId,
          objective: "[exact-page-claim-relay]",
          successCriteria: ["[exact-page-claim-relay]"],
        },
      };
    }
    if (startClaim.toolName === "devspace_plan_start") {
      return {
        toolName: startClaim.toolName,
        expiresAt: startClaim.expiresAt,
        arguments: {
          claimId: startClaim.claimId,
          title: "[exact-page-claim-relay]",
          steps: [
            { text: "[exact-page-claim-relay-current]", status: "in_progress" },
            { text: "[exact-page-claim-relay-next]", status: "pending" },
          ],
        },
      };
    }
    return null;
  };

  const dispatchGlobals = () => {
    void dispatch(window.openai?.toolOutput);
    // Some ChatGPT Desktop builds expose tool-result _meta separately from
    // structuredContent. The claim id is intentionally duplicated there so
    // page-local ownership confirmation does not depend on one host binding.
    void dispatch(window.openai?.toolResponseMetadata);
  };

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  let onOpenAiGlobals = null;
  let onHostMessage = null;
  const retireRelay = () => {
    if (relayRetired) return;
    relayRetired = true;
    dispatchStarted = true;
    if (onOpenAiGlobals) window.removeEventListener?.("openai:set_globals", onOpenAiGlobals);
    if (onHostMessage) window.removeEventListener?.("message", onHostMessage);
    onOpenAiGlobals = null;
    onHostMessage = null;
  };

  const dispatch = async (value) => {
    const action = relayActionFrom(value);
    if (!action || dispatchStarted || relayRetired) return;
    dispatchStarted = true;
    // The receipt is a live exact-page proof for subsequent Goal/Plan tools.
    // Retain it until its bounded expiry, then retire only this relay's local
    // listeners. A hidden ownership relay must never ask the ChatGPT host to
    // close UI: host-level widget closure can make current Desktop builds
    // leave a Project conversation's exact chat route.
    const expiresAt = Date.parse(String(action.expiresAt || ''));
    const lifetimeMs = Number.isFinite(expiresAt)
      ? Math.max(0, Math.min(120000, expiresAt - Date.now())) : 120000;
    setTimeout(() => { retireRelay(); }, lifetimeMs);
    for (let attempt = 0; attempt < 3; attempt += 1) {
      try {
        if (typeof window.openai?.callTool !== "function") throw new Error("tool bridge unavailable");
        const result = await window.openai.callTool(action.toolName, action.arguments);
        const structured = result?.structuredContent ?? result?.structured_content ?? result;
        if (action.toolName === "devspace_progress_report") {
          if (structured?.ok === true && structured?.claimed === true) {
            return;
          }
          throw new Error("progress claim was not completed");
        }
        if (structured?.claimed === true && (structured?.goal || structured?.plan)) {
          return;
        }
        throw new Error("conversation start claim was not completed");
      } catch {
        if (attempt < 2) await sleep(250 * (attempt + 1));
      }
    }
    // The expiry timer, not the host RPC result, owns resource retirement.
  };

  onOpenAiGlobals = () => {
    dispatchGlobals();
  };
  window.addEventListener("openai:set_globals", onOpenAiGlobals, { passive: true });

  onHostMessage = (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.method === "ui/notifications/tool-result") {
      void dispatch(message.params?.structuredContent ?? message.params);
    }
  };
  window.addEventListener("message", onHostMessage, { passive: true });

  dispatchGlobals();
})();
</script>
</body>
</html>
